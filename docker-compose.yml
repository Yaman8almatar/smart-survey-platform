services:
  db:
    image: postgres:15
    container_name: smart_survey_db_new
    restart: always
    environment:
      POSTGRES_DB: smart_survey_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - smart_survey_postgres_data_new:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_survey_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_survey_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - smart_survey_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_survey_web
    restart: always
    environment:
      DEBUG: "False"
      SECRET_KEY: "production-secure-smart-survey-key-32chars-min-length-safe"
      DB_NAME: smart_survey_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      USE_CELERY: "true"
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - smart_survey_static:/app/staticfiles

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_survey_celery_worker
    restart: always
    environment:
      DEBUG: "False"
      SECRET_KEY: "production-secure-smart-survey-key-32chars-min-length-safe"
      DB_NAME: smart_survey_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      USE_CELERY: "true"
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    entrypoint: ["tini", "--", "/app/docker-entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "-l", "info", "-c", "4"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_survey_celery_beat
    restart: always
    environment:
      DEBUG: "False"
      SECRET_KEY: "production-secure-smart-survey-key-32chars-min-length-safe"
      DB_NAME: smart_survey_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      USE_CELERY: "true"
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    entrypoint: ["tini", "--", "/app/docker-entrypoint.sh"]
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  smart_survey_postgres_data_new:
  smart_survey_redis_data:
  smart_survey_static:
